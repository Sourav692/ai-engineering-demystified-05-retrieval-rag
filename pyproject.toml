[project]
name = "ai-engineering-demystified-05-retrieval-rag"
version = "0.1.0"
description = "Retrieval and standard (non-agentic) RAG: loading, chunking, embeddings, vector stores, indexing, retrieval, query transformation, reranking and multimodal retrieval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LangChain stack
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-chroma>=1.1.0",
    "langchain-experimental>=0.4.2",
    "langchain-postgres>=0.0.17",
    "databricks-langchain>=0.20.0",  # imported by src/helpers
    "langsmith>=0.12.1",
    "openai>=2.54.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.12.5",
    # retrieval and numerics
    "faiss-cpu>=1.15.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.2",
    "pandas>=2.2",  # llama-index-readers-file requires pandas<3
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "matplotlib>=3.11.1",
    # document loaders
    "pypdf>=6.17.0",
    "pymupdf>=1.28.2",
    "jq>=1.8",
    "docx2txt>=0.9",
    "beautifulsoup4>=4.15.0",
    "youtube-transcript-api>=1.2.4",
    "arxiv>=4.0.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    # notebook utilities
    "cohere>=5.18",  # langchain-cohere (vendors group) requires cohere<6
    "deepeval>=4.2.1",  # imported by the anthology notebooks' evaluation/evalute_rag.py helper
    "nest-asyncio>=1.6.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=14.3.4",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13", "pre-commit>=4.0", "nbstripout>=0.8", "jupyterlab>=4.2", "ipykernel>=6.29"]
# Local models: Hugging Face embeddings, cross-encoders, CLIP (large download: torch)
hf = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "torch>=2.14.0",
    "pillow>=11.0",
]
# ColPali page retrieval (11_multimodal_rag/03). byaldi pins transformers<5, so this group
# cannot be installed together with `hf`: uv sync --no-default-groups --group dev --group colpali
colpali = [
    "byaldi>=0.0.7",
    "pillow>=11.0",
]
# Unstructured-based loaders and NLP splitters (large download)
document-parsing = [
    "unstructured[md,pdf,docx]>=0.27.5",
    "nltk>=3.9",
    "spacy>=3.8",
]
# LlamaIndex implementations (module 13 and 03/10_choose_chunk_size_llamaindex)
llamaindex = [
    "llama-index>=0.14",
    "llama-index-vector-stores-faiss>=0.5",
    "llama-index-readers-file>=0.5",
]
# Managed vector stores and third-party model APIs
vendors = [
    "langchain-pinecone>=0.2.13",
    "langchain-astradb>=1.0",
    "langchain-cohere>=0.5",
    "google-generativeai>=0.8.6",
    "jrag>=0.0.1",  # JSON-to-text tagging (10_building_rag_systems/10)
]
# Databricks Vector Search / MLflow notebooks (04/08, 07/08)
databricks = [
    "databricks-vectorsearch>=0.75",
    "mlflow>=3.16.0",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "hf" }, { group = "colpali" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpers"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lesson code and the copied helpers are kept byte-for-byte as they were taught; they are
# excluded from lint rather than restyled.
extend-exclude = [
    "*.ipynb",
    "modules/*/notebooks/*.py",
    "modules/*/notebooks/evaluation/*.py",
    "src/helpers",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
